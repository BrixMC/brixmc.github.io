<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://brix-api.brix-account.workers.dev; base-uri 'none'; form-action 'none'">
  <title>Brix - Forgot password</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="forgot">
  <main class="card">
    <img class="logo" src="logo.svg" alt="">
    <h1>BRIX</h1>
    <p class="sub">Enter your verified email and we will send a reset link.</p>
    <form id="forgot-form" method="post">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" maxlength="254" required>
      <button id="submit" type="submit">Send reset link</button>
    </form>
    <p id="msg" class="msg"></p>
    <a class="link" href="login.html">Back to login</a>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
