<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://brix-api.brix-account.workers.dev; connect-src https://brix-api.brix-account.workers.dev; base-uri 'none'; form-action 'none'">
  <title>Brix - Account</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="account">
  <main class="card">
    <div class="who">
      <canvas id="face" width="64" height="64" class="pixel"></canvas>
      <div>
        <h2 id="name">...</h2>
        <div id="uuid" class="mono"></div>
      </div>
    </div>

    <hr>
    <h3>Skin</h3>
    <p id="skin-state">Loading...</p>
    <div class="center"><img id="skin-img" class="pixel" width="128" height="128" alt="Current skin" hidden></div>

    <label for="skin-file">Upload skin (PNG, 64x64 or 64x32, max 24 KB)</label>
    <input id="skin-file" type="file" accept="image/png">
    <label for="skin-model">Arm style</label>
    <select id="skin-model">
      <option value="default">Classic</option>
      <option value="slim">Slim</option>
    </select>
    <button id="upload-btn" type="button">Upload skin</button>
    <button id="delete-btn" type="button" class="secondary">Remove skin</button>
    <p id="msg" class="msg"></p>

    <hr>
    <h3>Security</h3>
    <label for="pw-current">Current password</label>
    <input id="pw-current" type="password" autocomplete="current-password" maxlength="128">
    <label for="pw-new">New password (min. 8 characters)</label>
    <input id="pw-new" type="password" autocomplete="new-password" minlength="8" maxlength="128">
    <button id="pw-btn" type="button">Change password</button>
    <p id="pw-msg" class="msg"></p>

    <h3>Devices</h3>
    <ul id="session-list" class="sessions"></ul>
    <button id="revoke-others-btn" type="button" class="secondary">Log out other devices</button>
    <p id="sess-msg" class="msg"></p>

    <hr>
    <h3>Delete account</h3>
    <p>This permanently removes your account, skin and sessions.</p>
    <label for="del-pw">Password</label>
    <input id="del-pw" type="password" autocomplete="current-password" maxlength="128">
    <button id="del-btn" type="button" class="danger">Delete my account</button>
    <p id="del-msg" class="msg"></p>

    <hr>
    <button id="logout-btn" type="button" class="secondary">Logout</button>
    <footer>Brix is not affiliated with Mojang Studios or Microsoft.</footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
